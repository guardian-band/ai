# Offline teacher configuration. Repository producer commands build every
# artifact below; paths and hashes remain explicit to make provenance fail-closed.
model_type: multimodal_teacher
training_input_mode: precomputed_modalities

morgan_dim: 2048
molformer_dim: 768
mpnn_dim: 256
kg_dim: 256
molformer_token_count: 8
mpnn_token_count: 32
kg_token_count: 4
hidden_dim: 256
num_heads: 8
dropout: 0.1
cache_token_count: 8
cache_token_dim: 128
num_organ: 15
num_specific: 100
epochs: 30
batch_size: 128
patience: 5
learning_rate: 0.001
weight_decay: 0.0001
hierarchy_weight: 0.1

# Deliberately null until an offline producer has emitted and hashed the data.
feature_artifact_path: null
feature_artifact_sha256: null
hierarchy_path: null
hierarchy_sha256: null
offline_feature_artifacts:
  morgan:
    path: null
    sha256: null
  molformer_tokens:
    path: null
    sha256: null
  mpnn_tokens:
    path: null
    sha256: null
  kg_tokens:
    path: null
    sha256: null
