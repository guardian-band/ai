# Offline teacher configuration. Upstream MolFormer, molecular-MPNN, and
# PrimeKG/HGT producers are not part of this repository and must provide the
# validated artifacts named below before a training entry point can consume it.
model_type: multimodal_teacher
training_input_mode: precomputed_modalities

morgan_dim: 2048
molecular_dim: 768
kg_dim: 256
molecular_token_count: 8
kg_token_count: 8
hidden_dim: 256
num_heads: 8
dropout: 0.1
cache_token_count: 8
cache_token_dim: 128
num_organ: 15
num_specific: 100
epochs: 30
batch_size: 128
patience: 5
learning_rate: 0.001
weight_decay: 0.0001
hierarchy_weight: 0.1

# Deliberately null until an offline producer has emitted and hashed the data.
feature_artifact_path: null
feature_artifact_sha256: null
hierarchy_path: null
hierarchy_sha256: null
offline_feature_artifacts:
  morgan:
    path: null
    sha256: null
  molecular_tokens:
    path: null
    sha256: null
  kg_tokens:
    path: null
    sha256: null
